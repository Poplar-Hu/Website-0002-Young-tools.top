<script type="text/plain" id="sample-md">
# Markdown 预览

这是一个**纯前端**的 Markdown 渲染器，依赖库都放在本站，不引用外部 CDN。

## 支持的语法

- 粗体、*斜体*、~~删除线~~、`行内代码`
- 有序 / 无序列表、嵌套列表
- [链接](https://who-young.top) 与图片
- 引用、表格、分隔线

### 任务列表

- [x] 解析 Markdown
- [x] 代码高亮
- [ ] 想加什么自己改

### 表格

| 语法 | 效果 | 备注 |
| --- | --- | --- |
| `# 标题` | 一级标题 | 最多六级 |
| `**粗体**` | **粗体** | |
| `` `代码` `` | `行内代码` | |

}

<script>
(() => {
  'use strict';

  const editor   = document.getElementById('editor');
  const preview  = document.getElementById('preview');
  const stat     = document.getElementById('stat');
  const hint     = document.getElementById('hint');
  const fileIn   = document.getElementById('file-input');
  const STORAGE  = 'tools.markdown.content';

  /* 依赖是否就位 */
  const libsOk = typeof window.marked === 'function' || typeof window.marked?.parse === 'function';
  if (!libsOk || typeof window.DOMPurify === 'undefined') {
    document.getElementById('load-warn').classList.remove('hidden');
  }
  if (libsOk) {
    marked.setOptions({ gfm: true, breaks: true });
  }

  /* ── 渲染 ──────────────────────────────────────────────────────────── */
  let lastHtml = null;
  let saveTimer = null;

  // localStorage 是同步写盘，不能每敲一个键就写一次
  function scheduleSave(value) {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try { localStorage.setItem(STORAGE, value); } catch { /* 隐私模式下忽略 */ }
    }, 600);
  }

  function render() {
    const src = editor.value;
    if (!libsOk) return;

    let html;
    try {
      html = marked.parse(src);
    } catch (err) {
      lastHtml = null;
      preview.innerHTML = `<div class="notice notice-error"><i class="fa fa-exclamation-triangle"></i><div>${i18n.t('md-parse-fail', { msg: err.message }, '解析失败：' + err.message)}</div></div>`;
      return;
    }

    // 输入的是你自己的内容，但仍然过一遍 DOMPurify：
    // 万一把别人给的 markdown 粘进来，不至于直接执行脚本
    const clean = DOMPurify.sanitize(html, { USE_PROFILES: { html: true } });

    // 只有渲染结果真的变了才碰 DOM。
    // 之前每敲一个键都整体替换 innerHTML，并把所有代码块重新高亮一遍，
    // 长文档下就会明显发粘。
    if (clean !== lastHtml) {
      lastHtml = clean;
      preview.innerHTML = clean;
      if (typeof hljs !== 'undefined') {
        preview.querySelectorAll('pre code').forEach((el) => hljs.highlightElement(el));
      }
    }

    const chars = src.length;
    const lines = src ? src.split('\n').length : 0;
    stat.textContent = i18n.t('md-stat', { chars, lines }, `${chars} 字 · ${lines} 行`);
    hint.textContent = src ? '' : i18n.t('md-hint-empty', null, '输入内容后这里会实时更新');

    scheduleSave(src);
  }

  const renderDebounced = Tools.debounce(render, 180);

  /* ── 初始化 ────────────────────────────────────────────────────────── */
  const sample = document.getElementById('sample-md').textContent.replace(/^\n/, '').replace(/\s+$/, '');
  let restored = '';
  try { restored = localStorage.getItem(STORAGE) || ''; } catch { /* 忽略 */ }
  editor.value = restored || sample;
  render();

  // 语言包是异步到达的，而字数统计这类动态文案在首次 render 时只能拿到中文兜底。
  // 语言包就绪（以及之后每次切换语言）时重渲染一次。
  if (window.i18n) i18n.onReady(() => { lastHtml = null; render(); });

  editor.addEventListener('input', renderDebounced);

  /* Tab 键插入两个空格而不是跳出输入框 */
  editor.addEventListener('keydown', (e) => {
    if (e.key !== 'Tab') return;
    e.preventDefault();
    const s = editor.selectionStart, t = editor.selectionEnd;
    editor.value = editor.value.slice(0, s) + '  ' + editor.value.slice(t);
    editor.selectionStart = editor.selectionEnd = s + 2;
    renderDebounced();
  });

  /* ── 工具栏 ────────────────────────────────────────────────────────── */

  document.getElementById('btn-open').addEventListener('click', () => fileIn.click());

  fileIn.addEventListener('change', async () => {
    const f = fileIn.files && fileIn.files[0];
    if (!f) return;
    try {
      editor.value = await Tools.readTextFile(f);
      render();
      Tools.toast(i18n.t('toast-loaded', { name: f.name }, `已载入 ${f.name}`), 'ok');
    } catch {
      Tools.toast(i18n.t('toast-read-fail', null, '文件读取失败'), 'error');
    }
    fileIn.value = '';
  });

  document.getElementById('btn-save').addEventListener('click', () => {
    Tools.downloadText(`markdown-${Tools.stamp()}.md`, editor.value, 'text/markdown;charset=utf-8');
    Tools.toast(i18n.t('toast-saved-md', null, '已下载 .md'), 'ok');
  });

  document.getElementById('btn-copy').addEventListener('click', async () => {
    const ok = await Tools.copy(preview.innerHTML);
    Tools.toast(ok ? i18n.t('toast-copied-html', null, '已复制渲染后的 HTML')
                : i18n.t('toast-copy-fail', null, '复制失败，请手动选择'), ok ? 'ok' : 'error');
  });

  document.getElementById('btn-export').addEventListener('click', () => {
    const title = (editor.value.match(/^#\s+(.+)$/m) || [, i18n.t('md-doc-title', null, 'Markdown 文档')])[1];
    const doc = `<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>${title.replace(/[<>&]/g, '')}</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github.min.css">
<style>
  body { max-width: 46rem; margin: 0 auto; padding: 2.5rem 1.25rem 5rem; line-height: 1.8;
         font-family: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
         color: #1E293B; }
  h1, h2 { border-bottom: 1px solid #E5E7EB; padding-bottom: .3em; }
  pre { background: #F6F8FA; border: 1px solid #E5E7EB; border-radius: 8px; padding: 14px 16px; overflow: auto; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: .9em; }
  :not(pre) > code { background: #F3F4F6; padding: .15em .4em; border-radius: 5px; }
  blockquote { margin: 0 0 1em; padding: .6em 1em; border-left: 4px solid #3B82F6; background: #F5F7FA; color: #4B5563; }
  table { border-collapse: collapse; width: 100%; }
  th, td { border: 1px solid #E5E7EB; padding: 8px 12px; text-align: left; }
  th { background: #F5F7FA; }
  img { max-width: 100%; }
</style>
</head>
<body>
${preview.innerHTML}

</body>
</html>`;
    Tools.downloadText(`markdown-${Tools.stamp()}.html`, doc, 'text/html;charset=utf-8');
    Tools.toast(i18n.t('toast-exported-html', null, '已导出 HTML'), 'ok');
  });

  document.getElementById('btn-sample').addEventListener('click', () => {
    editor.value = sample;
    render();
    Tools.toast(i18n.t('toast-sample', null, '已载入示例'), 'info');
  });

  document.getElementById('btn-clear').addEventListener('click', () => {
    editor.value = '';
    render();
    editor.focus();
  });

  /* ── 拖放 .md 文件 ─────────────────────────────────────────────────── */
  ['dragenter', 'dragover'].forEach((ev) =>
    preview.addEventListener(ev, (e) => { e.preventDefault(); preview.classList.add('is-drop'); })
  );
  ['dragleave', 'drop'].forEach((ev) =>
    preview.addEventListener(ev, () => preview.classList.remove('is-drop'))
  );
  preview.addEventListener('drop', async (e) => {
    e.preventDefault();
    const f = e.dataTransfer?.files?.[0];
    if (!f) return;
    try {
      editor.value = await Tools.readTextFile(f);
      render();
      Tools.toast(`已载入 ${f.name}`, 'ok');
    } catch {
      Tools.toast(i18n.t('toast-text-only', null, '只能拖入文本文件'), 'error');
    }
  });

  /* ── 快捷键 ────────────────────────────────────────────────────────── */
  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
      e.preventDefault();
      document.getElementById('btn-save').click();
    }
  });
})();
</script>

</body>
