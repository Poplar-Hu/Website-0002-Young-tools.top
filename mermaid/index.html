<main class="tool-shell wrap">

  </div>

          placeholder="flowchart LR&#10;  A[开始] --> B{判断}&#10;  B -->|是| C[继续]&#10;  B -->|否| D[结束]"></textarea>
      </div>
      <div class="pane">

<script>
document.addEventListener('DOMContentLoaded', () => {
  'use strict';

  const editor  = document.getElementById('editor');
  const canvas  = document.getElementById('canvas');
  const stat    = document.getElementById('stat');
  const hint    = document.getElementById('hint');
  const errBox  = document.getElementById('err-box');
  const errMsg  = document.getElementById('err-msg');
  const tplSel  = document.getElementById('tpl-select');
  const STORAGE = 'tools.mermaid.content';

  /* ── 模板 ──────────────────────────────────────────────────────────── */
  const TEMPLATES = {
    flowchart: `flowchart LR
    A([开始]) --> B{条件判断}
    B -->|满足| C[执行操作]
    B -->|不满足| D[跳过]
    C --> E[(数据库)]
    D --> E
    E --> F([结束])`,

    sequence: `sequenceDiagram
    autonumber
    participant U as 用户
    participant S as 服务端
    participant D as 数据库
    U->>S: 发起请求
    activate S
    S->>D: 查询数据
    D-->>S: 返回结果
    S-->>U: 响应
    deactivate S
    Note over U,D: 一次完整的往返`,

    class: `classDiagram
    class 站点 {
      +String 域名
      +部署()
      +回滚()
    }
    class 静态站 {
      +String 根目录
      +构建()
    }
    class 工具站 {
      +List 工具列表
    }
    站点 <|-- 静态站
    静态站 <|-- 工具站`,

    state: `stateDiagram-v2
    [*] --> 待办
    待办 --> 进行中: 开始
    进行中 --> 待评审: 提交
    待评审 --> 进行中: 打回
    待评审 --> 已完成: 通过
    已完成 --> [*]`,

    gantt: `gantt
    title 建站排期
    dateFormat YYYY-MM-DD
    axisFormat %m-%d
    section 准备
    买域名与服务器     :done,    a1, 2026-09-25, 5d
    环境搭建           :done,    a2, after a1, 4d
    section 主体
    主站上线           :active,  b1, 2026-10-02, 3d
    工具站             :         b2, after b1, 4d
    section 收尾
    备案与解析         :         c1, after b2, 10d`,

    pie: `pie showData
    title 时间都去哪儿了
    "写代码" : 40
    "查文档" : 25
    "改 bug" : 20
    "发呆"   : 15`,

    git: `gitGraph
    commit id: "初始化"
    branch feature
    commit id: "写页面"
    commit id: "改样式"
    checkout main
    merge feature
    commit id: "发布"`,
  };

  // 模板名走 i18n；option 的 value 用稳定 id，与当前语言无关
  const TPL_LABELS = {
    flowchart: 'mmd-tpl-flowchart', sequence: 'mmd-tpl-sequence', class: 'mmd-tpl-class',
    state: 'mmd-tpl-state', gantt: 'mmd-tpl-gantt', pie: 'mmd-tpl-pie', git: 'mmd-tpl-git',
  };

  function rebuildTemplates() {
    const keep = tplSel.value;
    tplSel.innerHTML = '';
    const placeholder = document.createElement('option');
    placeholder.value = '';
    placeholder.textContent = i18n.t('mmd-template', null, '选择模板…');
    tplSel.appendChild(placeholder);
    for (const id of Object.keys(TEMPLATES)) {
      const opt = document.createElement('option');
      opt.value = id;
      opt.textContent = i18n.t(TPL_LABELS[id], null, id);
      tplSel.appendChild(opt);
    }
    tplSel.value = keep;
  }
  rebuildTemplates();
  // 切换语言后重建选项文字
  i18n.onReady(rebuildTemplates);

  /* ── 初始化 mermaid ────────────────────────────────────────────────── */
  const libOk = typeof window.mermaid !== 'undefined';
  if (!libOk) {
    document.getElementById('load-warn').classList.remove('hidden');
    canvas.innerHTML = `<div class="mmd-empty">${i18n.t('mmd-unavailable', null, '渲染引擎不可用')}</div>`;
    return;
  }

  mermaid.initialize({
    startOnLoad: false,
    theme: 'default',
    // 不用 HTML 标签，改用纯 SVG <text>：
    // 这样导出的 SVG 序列化后不会被 foreignObject 污染，PNG 导出才正常
    htmlLabels: false,
    securityLevel: 'strict',
    fontFamily: 'system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif',
    flowchart: { htmlLabels: false, useMaxWidth: true, curve: 'basis' },
  });

  /* ── 渲染 ──────────────────────────────────────────────────────────── */
  let seq = 0;
  let rendering = false;
  let pending = false;

  function showError(msg) {
    errMsg.textContent = msg;
    errBox.classList.remove('hidden');
    hint.textContent = i18n.t('mmd-failed', null, '渲染失败');
    hint.classList.remove('busy');
  }
  function clearError() {
    errBox.classList.add('hidden');
    hint.textContent = '';
    hint.classList.remove('busy');
  }

  let lastCode = null;
  let saveTimer = null;

  // localStorage 是同步写盘，单独防抖
  function scheduleSave(value) {
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      try { localStorage.setItem(STORAGE, value); } catch { /* 忽略 */ }
    }, 600);
  }

  async function render() {
    const raw = editor.value;
    const code = raw.trim();
    stat.textContent = i18n.t('mmd-stat', { chars: raw.length }, `${raw.length} 字`);
    scheduleSave(raw);

    if (!code) {
      lastCode = '';
      canvas.innerHTML = `<div class="mmd-empty">${i18n.t('mmd-empty', null, '在左边写点 Mermaid 代码试试')}</div>`;
      clearError();
      return;
    }

    // 内容没变就不重画。mermaid 一次渲染要几百毫秒，
    // 光标移动、按住方向键这类不改变内容的事件不该触发重绘。
    if (code === lastCode) return;

    // 避免并发渲染互相覆盖
    if (rendering) { pending = true; return; }
    rendering = true;
    hint.textContent = i18n.t('mmd-rendering', null, '渲染中…');
    hint.classList.add('busy');

    const id = 'mmd-' + (++seq);
    try {
      const { svg } = await mermaid.render(id, code);
      canvas.innerHTML = svg;
      lastCode = code;
      clearError();
    } catch (err) {
      // 语法错误也记下来，避免每敲一个键都重复报同一个错
      lastCode = code;
      const msg = String(err && err.message ? err.message : err);
      showError(msg.split('\n').slice(0, 4).join('\n'));
    } finally {
      rendering = false;
      // mermaid 渲染失败时可能在 body 上留下临时元素，清掉
      document.querySelectorAll('body > div[id^="dmmd-"], body > div[id^="mmd-"]').forEach((el) => {
        if (!canvas.contains(el)) el.remove();
      });
      if (pending) { pending = false; render(); }
    }
  }

  const renderDebounced = Tools.debounce(render, 600);

  /* ── 初始化内容 ────────────────────────────────────────────────────── */
  let restored = '';
  try { restored = localStorage.getItem(STORAGE) || ''; } catch {}
  editor.value = restored || TEMPLATES.flowchart;
  render();

  // 同理：清掉 lastCode 强制完整重渲染，空状态与错误提示才会跟着换语言
  if (window.i18n) i18n.onReady(() => { lastCode = null; render(); });

  editor.addEventListener('input', renderDebounced);
  editor.addEventListener('keydown', (e) => {
    if (e.key !== 'Tab') return;
    e.preventDefault();
    const s = editor.selectionStart, t = editor.selectionEnd;
    editor.value = editor.value.slice(0, s) + '  ' + editor.value.slice(t);
    editor.selectionStart = editor.selectionEnd = s + 2;
    renderDebounced();
  });

  tplSel.addEventListener('change', () => {
    const id = tplSel.value;
    if (!id || !TEMPLATES[id]) return;
    editor.value = TEMPLATES[id];
    render();
    const label = i18n.t(TPL_LABELS[id], null, id);
    Tools.toast(i18n.t('toast-template', { name: label }, `已载入「${label}」模板`), 'info');
    tplSel.value = '';
  });

  /* ── 导出 ──────────────────────────────────────────────────────────── */

  /** 取出当前 SVG 的独立副本，并确保带 xmlns 与明确的宽高 */
  function currentSvg() {
    const svg = canvas.querySelector('svg');
    if (!svg) { Tools.toast(i18n.t('toast-nothing', null, '还没有可导出的图'), 'warn'); return null; }
    const clone = svg.cloneNode(true);
    clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
    clone.setAttribute('xmlns:xlink', 'http://www.w3.org/1999/xlink');
    clone.removeAttribute('style');

    const vb = (svg.getAttribute('viewBox') || '').split(/[\s,]+/).map(Number);
    let w = vb[2], h = vb[3];
    if (!w || !h) {
      const b = svg.getBBox();
      w = Math.ceil(b.width) || 800;
      h = Math.ceil(b.height) || 600;
    }
    clone.setAttribute('width', w);
    clone.setAttribute('height', h);
    return { clone, w, h };
  }

  document.getElementById('btn-svg').addEventListener('click', () => {
    const got = currentSvg();
    if (!got) return;
    const text = '<?xml version="1.0" encoding="UTF-8"?>\n' + new XMLSerializer().serializeToString(got.clone);
    Tools.downloadText(`mermaid-${Tools.stamp()}.svg`, text, 'image/svg+xml;charset=utf-8');
    Tools.toast(i18n.t('toast-exported-svg', null, '已导出 SVG'), 'ok');
  });

  document.getElementById('btn-png').addEventListener('click', async () => {
    const got = currentSvg();
    if (!got) return;
    const scale = 2; // 2 倍图，贴进文档里不糊
    try {
      const svgText = new XMLSerializer().serializeToString(got.clone);
      const url = URL.createObjectURL(new Blob([svgText], { type: 'image/svg+xml;charset=utf-8' }));
      const img = new Image();
      await new Promise((res, rej) => { img.onload = res; img.onerror = () => rej(new Error(i18n.t('svg-load-fail', null, 'SVG 载入失败'))); img.src = url; });

      const c = document.createElement('canvas');
      c.width = got.w * scale;
      c.height = got.h * scale;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#ffffff';
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);

      await new Promise((res, rej) => {
        c.toBlob((b) => {
          if (!b) { rej(new Error(i18n.t('canvas-fail', null, '画布导出失败'))); return; }
          Tools.downloadBlob(`mermaid-${Tools.stamp()}.png`, b);
          res();
        }, 'image/png');
      });
      Tools.toast(i18n.t('toast-exported-png', null, '已导出 PNG'), 'ok');
    } catch (err) {
      Tools.toast(i18n.t('toast-png-fail', { msg: err.message }, 'PNG 导出失败：' + err.message), 'error');
    }
  });

  document.getElementById('btn-copy').addEventListener('click', async () => {
    const ok = await Tools.copy(editor.value);
    Tools.toast(ok ? i18n.t('toast-copied-code', null, '已复制代码')
                : i18n.t('toast-copy-fail', null, '复制失败'), ok ? 'ok' : 'error');
  });

  document.getElementById('btn-clear').addEventListener('click', () => {
    editor.value = '';
    render();
    editor.focus();
  });

  document.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
      e.preventDefault();
      document.getElementById('btn-svg').click();
    }
  });
});
</script>
